<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Playful math elements -->
  <!-- Cute star badge in corner -->
  <circle cx="390" cy="115" r="48" fill="#fbbf24" filter="url(#shadow)" />
  <path d="M 390 85 L 398 105 L 420 108 L 404 122 L 408 144 L 390 133 L 372 144 L 376 122 L 360 108 L 382 105 Z" fill="#ffffff" />
  
  <!-- Plus symbol -->
  <g filter="url(#shadow)">
    <rect x="110" y="160" width="100" height="28" rx="14" fill="#38bdf8" />
    <rect x="146" y="124" width="28" height="100" rx="14" fill="#38bdf8" />
  </g>
  
  <!-- Multiply symbol -->
  <g transform="translate(370, 240) rotate(45)" filter="url(#shadow)">
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#f43f5e" />
    <rect x="-12" y="-45" width="24" height="90" rx="12" fill="#f43f5e" />
  </g>
  
  <!-- Number 1 2 3 cute blocks -->
  <g filter="url(#shadow)">
    <circle cx="160" cy="350" r="42" fill="#34d399" />
    <text x="160" y="366" font-family="'Nunito', sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    
    <circle cx="260" cy="310" r="46" fill="#fb923c" />
    <text x="260" y="327" font-family="'Nunito', sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    
    <circle cx="360" cy="360" r="42" fill="#a855f7" />
    <text x="360" y="376" font-family="'Nunito', sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- Friendly smile banner -->
  <path d="M 210 210 Q 260 250 310 210" stroke="#fef08a" stroke-width="14" stroke-linecap="round" fill="none" />
</svg>
